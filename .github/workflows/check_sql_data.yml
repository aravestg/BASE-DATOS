name: VERIFICAR Sentencia 'commit' en Archivos SQL

on:
  push:
    branches:
      - 'development'

jobs:
  check_sql_data:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Buscar archivos SQL y verificar 'commit'
        id: verificar_commit
        run: |
          echo "Buscando archivos DATA*.sql modificados..."
          missing_commit_files=()
          for file in $(git ls-files --modified --name-only 'DATA*.sql'); do
            if ! grep -iq 'commit' "$file"; then
              echo "El archivo $file no contiene la sentencia 'commit'."
              missing_commit_files+=("$file")
              echo "::error file=$file,title=FALTA 'commit'::El archivo no contiene la sentencia 'commit'."
            fi
          done
          if [ ${#missing_commit_files[@]} -gt 0 ]; then
            echo "Archivos sin 'commit':"
            for file in "${missing_commit_files[@]}"; do
              echo "- $file"
            done
            echo "Generando reporte en report.txt..."
            printf "%s\n" "${missing_commit_files[@]}" > report.txt
            echo "fail_job=true" >> $GITHUB_OUTPUT
            echo "files_without_commit=${missing_commit_files[*]}" >> $GITHUB_ENV
          else
            echo "Todos los archivos contienen la sentencia 'commit'."
            echo "fail_job=false" >> $GITHUB_OUTPUT
          fi

      - name: Fallar el job si es necesario
        if: steps.verificar_commit.outputs.fail_job == 'true'
        run: |
          echo "El job fallará debido a archivos sin 'commit'."
          exit 1

      - name: Crear un issue si faltan commits
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          FILES_WITHOUT_COMMIT: ${{ env.files_without_commit }}
        run: |
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          BRANCH_NAME=${{ github.ref_name }}
          RUNID=${{ github.run_number }}
          ISSUE_TITLE="${BRANCH_NAME}-${RUNID} - Archivos SQL sin 'commit' detectados"
          ISSUE_BODY="Se detectaron los siguientes archivos SQL sin la sentencia 'commit':\n\n"
          for file in $FILES_WITHOUT_COMMIT; do
            ISSUE_BODY="${ISSUE_BODY}- ${file}\n"
          done
          existing_issue=$(gh issue list --label "error-sql-commit" --state open --search "$ISSUE_TITLE" --json number -q '.[0].number')
          if [ -z "$existing_issue" ]; then
            gh issue create --title "$ISSUE_TITLE" --body "$ISSUE_BODY" --label "error-sql-commit"
            echo "Issue creado."
          else
            echo "Ya existe un issue abierto para este error (issue #$existing_issue)."
          fi

      - name: Cerrar issues resueltos
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          for file in $(git ls-files --modified --name-only 'DATA*.sql'); do
            # Buscar issues abiertos relacionados con el archivo
            issue_number=$(gh issue list --label "error-sql-commit" --state open --search "$file" --json number -q '.[0].number')
            if [ ! -z "$issue_number" ]; then
              # Cerrar el issue si existe
              gh issue close $issue_number --comment "El archivo $file ahora contiene la sentencia 'commit'."
              echo "Issue #$issue_number cerrado."
            fi
          done

      - name: Actualizar issues existentes
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          for file in $(git ls-files --modified --name-only 'DATA*.sql'); do
            # Buscar issues abiertos relacionados con el archivo
            issue_number=$(gh issue list --label "error-sql-commit" --state open --search "$file" --json number -q '.[0].number')
            if [ ! -z "$issue_number" ]; then
              # Obtener la lista de archivos del issue
              issue_files=$(gh issue view $issue_number --body | grep -oE '\- [^ ]+\.sql' | awk '{print $2}')
              
              # Verificar si el archivo actual contiene 'commit'
              if grep -iq 'commit' "$file"; then
                # Añadir un comentario indicando que el archivo ahora es válido
                gh issue comment $issue_number --body "El archivo $file ahora contiene la sentencia 'commit'."
              fi

              # Verificar si todos los archivos del issue contienen 'commit'
              all_files_valid=true
              for issue_file in $issue_files; do
                if ! grep -iq 'commit' "$issue_file"; then
                  all_files_valid=false
                  break
                fi
              done

              # Cerrar el issue si todos los archivos son válidos
              if $all_files_valid; then
                gh issue close $issue_number --comment "Todos los archivos ahora contienen la sentencia 'commit'."
                echo "Issue #$issue_number cerrado."
              fi
            fi
          done
